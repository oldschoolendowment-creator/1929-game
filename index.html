<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Long Fall</title>

<!-- Page-view analytics only (GoatCounter — no cookies, no accounts for players). -->
<script data-goatcounter="https://oldschoolendowment.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<!-- Chart.js, for the four price charts below. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  /* Some hosts (like itch.io) embed this page in a fixed-size box that
     doesn't scroll on its own. Making our own root element scrollable
     means the page is still fully reachable even in a short embed,
     instead of just getting cut off at the bottom. */
  html {
    height: 100%;
    overflow-y: auto;
  }
  /* Just enough styling to make the text easy to read. No layout tricks yet. */
  body {
    font-family: Georgia, serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 0 20px;
    line-height: 1.5;
    color: #222;
  }
  #date {
    color: #666;
    font-size: 0.9em;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #headline {
    font-size: 1.6em;
    margin: 4px 0 16px 0;
  }
  #situation {
    margin-bottom: 24px;
    /* The path-specific paragraph is joined on with a blank line. Without
       this, textContent collapses that into a single space and the two
       paragraphs run together. */
    white-space: pre-wrap;
  }
  button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px;
    margin-bottom: 10px;
    font-family: inherit;
    font-size: 1em;
    cursor: pointer;
  }
  #statusbar {
    display: flex;
    justify-content: space-between;
    font-family: sans-serif;
    font-size: 0.9em;
    border-bottom: 1px solid #ccc;
    padding-bottom: 10px;
    margin-bottom: 10px;
  }
  #charts {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 14px;
    border-bottom: 1px solid #ccc;
  }
  #charts > div {
    flex: 1;
    min-width: 0;
    /* Chart.js needs its container to have an actual CSS height (not
       just the canvas's HTML height attribute) or it misjudges its own
       proportions on first render. */
    height: 140px;
  }
  #charts h3 {
    font-family: sans-serif;
    font-size: 0.85em;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #666;
    margin: 0 0 4px 0;
  }
  #historical-charts {
    margin-bottom: 24px;
    padding-bottom: 14px;
    border-bottom: 1px solid #ccc;
  }
  #historical-charts > div {
    margin-bottom: 20px;
  }
  /* Chart.js needs ITS OWN sized container — not one shared with the
     title/source text — or it fights those siblings for space. */
  .chart-canvas-wrap {
    height: 180px;
  }
  #historical-charts h3 {
    font-family: sans-serif;
    font-size: 1em;
    font-weight: bold;
    text-align: center;
    margin: 0 0 8px 0;
  }
  .chart-source {
    font-family: sans-serif;
    font-size: 0.75em;
    color: #888;
    margin: 4px 0 0 0;
  }
</style>
</head>
<body>

  <!-- Shows cash, debt, shares and gold. Starts at the config values and
       updates as choices are clicked. -->
  <div id="statusbar">
    <span>Cash: $<span id="stat-cash"></span></span>
    <span>Debt: $<span id="stat-debt"></span></span>
    <span>Shares: $<span id="stat-stocks"></span></span>
    <span>Gold: $<span id="stat-gold"></span></span>
  </div>

  <!-- The player's own numbers, one bar each — same figures as the status
       bar above, just as a visual cue. Replaced (not accumulated) each
       round. Order matches the status bar: cash, debt, shares, gold. -->
  <div id="charts">
    <div>
      <h3>Cash</h3>
      <canvas id="cash-chart" height="120"></canvas>
    </div>
    <div>
      <h3>Debt</h3>
      <canvas id="debt-chart" height="120"></canvas>
    </div>
    <div>
      <h3>Shares</h3>
      <canvas id="shares-chart" height="120"></canvas>
    </div>
    <div>
      <h3>Gold</h3>
      <canvas id="gold-chart" height="120"></canvas>
    </div>
  </div>

  <!-- Real historical prices (not the game's own invented numbers above).
       Each shows real data only up to the current round's date — see
       asOfDate on each round in rounds.js — so more of the real history
       is revealed as you play, same idea as the two charts above. -->
  <div id="historical-charts">
    <div>
      <h3>Dow Jones Industrial Average</h3>
      <div class="chart-canvas-wrap"><canvas id="historical-dow-chart"></canvas></div>
      <p class="chart-source" id="historical-dow-source"></p>
    </div>
    <div>
      <h3>Gold Price ($/oz)</h3>
      <div class="chart-canvas-wrap"><canvas id="historical-gold-chart"></canvas></div>
      <p class="chart-source" id="historical-gold-source"></p>
    </div>
  </div>

  <!-- These four elements get their contents replaced every time we show a new round. -->
  <div id="date"></div>
  <div id="headline"></div>
  <div id="situation"></div>
  <div id="choices"></div>

  <!-- Loads the ROUNDS data object. Must come before our script below. -->
  <script src="rounds.js"></script>
  <script>
    // Which round we're currently showing. Starts at the first one.
    var currentRoundIndex = 0;

    // The player's current numbers, starting from the config values.
    // These change as choices are clicked.
    //
    // Stocks and gold are tracked as "units" (like shares), not dollars,
    // because their dollar value moves every round with the market price.
    // stocksValue/goldValue are the dollar amounts we actually show on
    // screen, recalculated at the end of every round.
    var state = {
      cash: ROUNDS.config.startingCash,
      debt: ROUNDS.config.startingDebt,
      stockUnits: ROUNDS.config.startingStocks,
      goldUnits: ROUNDS.config.startingGold,
      stocksValue: ROUNDS.config.startingStocks,
      goldValue: ROUNDS.config.startingGold,
      // The player's ongoing per-round earnings. A choice's "income"
      // effect changes this, but only takes effect starting the following
      // round — see creditIncome below. "incomeMultiplier" scales it
      // instead of adding to it (used once, for closing the store).
      income: ROUNDS.config.startingIncome,
      // Flags a choice has set so far, e.g. "cash_at_home". Used by
      // other choices' "requires" gate later in the game.
      flags: [],
      // Which life the player chose in round 1: "job" or "business".
      // Stays null until a round 1 choice sets it. Rounds later in the
      // game show different choices and different text depending on it.
      path: null,
      // True once the player's earnings have been permanently wiped out
      // (the 1932 layoff, or a business closing). Kept separate from
      // income being zero, because a player can be laid off and then
      // take relief work, which puts income back above zero.
      lostLivelihood: false
    };

    // True if the player currently has the given flag set.
    function hasFlag(flagName) {
      return state.flags.indexOf(flagName) !== -1;
    }

    // Writes the current state numbers into the status bar on screen.
    // Rounded to whole dollars for display — selling fractional stock
    // units (e.g. half of 1.667 units) can otherwise leave cash as an
    // ugly repeating decimal like 3616.666666666666.
    function updateStatusBar() {
      document.getElementById("stat-cash").textContent = Math.round(state.cash);
      document.getElementById("stat-debt").textContent = Math.round(state.debt);
      document.getElementById("stat-stocks").textContent = state.stocksValue;
      document.getElementById("stat-gold").textContent = state.goldValue;
    }

    // The game's own four charts, one bar each: cash, debt, shares, gold.
    // Same order as the status bar. Each is a single bar for the current
    // round's numbers, replaced (not accumulated) each round.
    var cashChart, debtChart, sharesChart, goldChart;

    // Builds one of the four single-bar charts. All four use the same
    // shape, just a different canvas and colour, so this avoids writing
    // near-identical Chart.js setup code four times over.
    function makeBarChart(canvasId, color) {
      return new Chart(document.getElementById(canvasId), {
        type: "bar",
        data: { labels: [""], datasets: [{ data: [0], backgroundColor: color }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: { legend: { display: false } },
          // No fixed ceiling — unlike the historical charts below, these
          // track the PLAYER'S OWN numbers in dollars (same as the status
          // bar), which can end the game anywhere from $0 into the
          // thousands depending how they played. Auto-scaling fits that.
          scales: { y: { beginAtZero: true } }
        }
      });
    }

    function initCharts() {
      cashChart = makeBarChart("cash-chart", "#369");
      debtChart = makeBarChart("debt-chart", "#c60");
      sharesChart = makeBarChart("shares-chart", "#a33");
      goldChart = makeBarChart("gold-chart", "#a90");
    }

    // Replaces each chart's single bar with the player's current numbers
    // — the same figures shown in the status bar, not any underlying
    // market price (that's what the historical charts further down are
    // for). Called once per round from renderRound, so each bar always
    // shows where things stand right now, not a history.
    function updateCharts(round) {
      [cashChart, debtChart, sharesChart, goldChart].forEach(function (chart) {
        chart.data.labels[0] = round.date;
      });
      cashChart.data.datasets[0].data[0] = Math.round(state.cash);
      debtChart.data.datasets[0].data[0] = Math.round(state.debt);
      sharesChart.data.datasets[0].data[0] = state.stocksValue;
      goldChart.data.datasets[0].data[0] = state.goldValue;
      [cashChart, debtChart, sharesChart, goldChart].forEach(function (chart) {
        chart.update();
      });
    }

    // The two REAL historical price charts (separate from the game's
    // own invented round-by-round prices above). Both start empty and
    // are rebuilt each round to show every real data point up to that
    // round's asOfDate — see updateHistoricalCharts below.
    var historicalDowChart;
    var historicalGoldChart;

    function initHistoricalCharts() {
      historicalDowChart = new Chart(document.getElementById("historical-dow-chart"), {
        type: "line",
        data: { labels: [], datasets: [{ data: [], borderColor: "#a33", borderWidth: 1.5, pointRadius: 0, tension: 0 }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: { legend: { display: false } },
          // Fixed 0-400 ceiling, matching the range Dow actually moved
          // in during this era.
          scales: {
            y: { beginAtZero: true, max: 400 },
            x: { ticks: { font: { size: 9 }, maxRotation: 0, autoSkip: true } }
          }
        }
      });

      historicalGoldChart = new Chart(document.getElementById("historical-gold-chart"), {
        type: "line",
        data: { labels: [], datasets: [{ data: [], borderColor: "#a90", borderWidth: 1.5, pointRadius: 0, tension: 0 }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: { legend: { display: false } },
          // No fixed ceiling here (unlike Dow) — gold's real 1920-1933
          // range (about $17-26) is too narrow to read against a 0-400
          // scale, so this lets the axis fit the real movement.
          scales: {
            y: { ticks: { font: { size: 9 } } },
            x: { ticks: { font: { size: 9 }, maxRotation: 0, autoSkip: true } }
          }
        }
      });

      document.getElementById("historical-dow-source").textContent = "Source: " + ROUNDS.historicalPrices.source;
      document.getElementById("historical-gold-source").textContent = "Source: " + ROUNDS.historicalPrices.source;
    }

    // Rebuilds both historical charts from scratch, showing every real
    // data point up to (and including) the current round's asOfDate.
    // Called once per round from renderRound, same as updateCharts.
    function updateHistoricalCharts(round) {
      // Monthly data is keyed like "1929-11"; asOfDate is a full day
      // like "1929-11-30". Compare at month precision.
      var cutoffMonth = round.asOfDate.slice(0, 7);

      var dowPoints = ROUNDS.historicalPrices.dow.filter(function (p) { return p.date <= cutoffMonth; });
      historicalDowChart.data.labels = dowPoints.map(function (p) { return p.date; });
      historicalDowChart.data.datasets[0].data = dowPoints.map(function (p) { return p.price; });
      historicalDowChart.update();

      var goldPoints = ROUNDS.historicalPrices.gold.filter(function (p) { return p.date <= cutoffMonth; });
      historicalGoldChart.data.labels = goldPoints.map(function (p) { return p.date; });
      historicalGoldChart.data.datasets[0].data = goldPoints.map(function (p) { return p.price; });
      historicalGoldChart.update();
    }

    // Looks up what one "unit" of an asset costs in a given round.
    // Stock price comes from that round's Dow figure in the market table.
    // Gold is fixed at $20.67/oz per config.goldPriceRule.
    //
    // overridePrice lets a single choice transact at a different price
    // than the round's normal one. Only round 4 uses this — see
    // ROUND_4_BOUNCE_PRICE below for why.
    function getAssetPrice(asset, roundId, overridePrice) {
      if (typeof overridePrice === "number") {
        return overridePrice;
      }
      if (asset === "gold") {
        return 20.67;
      }
      return ROUNDS.market[roundId].dow;
    }

    // Handles a choice's "buy" effect: spend money to acquire units of
    // an asset. Either a fixed dollar "amount", or a "fraction" of
    // current cash (used where the content spends a percentage of savings).
    function applyBuy(buy, roundId, overridePrice) {
      var price = getAssetPrice(buy.asset, roundId, overridePrice);
      var dollarAmount;

      if (typeof buy.amount === "number") {
        dollarAmount = buy.amount;
      } else if (typeof buy.fraction === "number") {
        dollarAmount = state.cash * buy.fraction;
        state.cash = state.cash - dollarAmount;
      }

      var units = dollarAmount / price;
      if (buy.asset === "stock") {
        state.stockUnits = state.stockUnits + units;
      } else if (buy.asset === "gold") {
        state.goldUnits = state.goldUnits + units;
      }
    }

    // Handles a choice's "sell" effect: sell a fraction of currently
    // held units of an asset, adding the proceeds straight to cash.
    function applySell(sell, roundId, overridePrice) {
      var price = getAssetPrice(sell.asset, roundId, overridePrice);
      var unitsHeld = sell.asset === "stock" ? state.stockUnits : state.goldUnits;
      var unitsToSell = unitsHeld * sell.fraction;
      var proceeds = unitsToSell * price;

      if (sell.asset === "stock") {
        state.stockUnits = state.stockUnits - unitsToSell;
      } else if (sell.asset === "gold") {
        state.goldUnits = state.goldUnits - unitsToSell;
      }
      state.cash = state.cash + proceeds;
    }

    // Recalculates the dollar value of stock and gold holdings using
    // the given round's prices. Called at the end of every round, per
    // the design: holdings are revalued each round even if untouched.
    function revalue(roundId) {
      state.stocksValue = Math.round(state.stockUnits * getAssetPrice("stock", roundId));
      state.goldValue = Math.round(state.goldUnits * getAssetPrice("gold", roundId));
    }

    // Applies a choice's effects to the state: cash, debt, buy, sell,
    // income, incomeMultiplier, path and flags. Note: an "income" effect
    // changes the ongoing baseline for future rounds — it does not add
    // money to cash right now. Crediting the existing baseline to cash
    // happens separately, once per round, in the click handler below
    // (see creditIncome).
    function applyEffects(effects, roundId, overridePrice) {
      if (typeof effects.cash === "number") {
        state.cash = state.cash + effects.cash;
      }
      if (typeof effects.debt === "number") {
        state.debt = state.debt + effects.debt;
      }
      if (typeof effects.income === "number") {
        state.income = state.income + effects.income;
      }
      // "path" records the life the player picked in round 1. Only the
      // three round 1 choices use it. Everything after that reads it.
      if (typeof effects.path === "string") {
        state.path = effects.path;
      }
      // "incomeMultiplier" scales the ongoing earnings baseline instead
      // of adding to it. Used for closing the business, where the whole
      // income is cut to a proportion rather than a fixed dollar amount.
      // Applied after any "income" change above, so a choice can do both.
      if (typeof effects.incomeMultiplier === "number") {
        state.income = Math.round(state.income * effects.incomeMultiplier);
      }
      if (effects.buy) {
        applyBuy(effects.buy, roundId, overridePrice);
      }
      if (effects.sell) {
        applySell(effects.sell, roundId, overridePrice);
      }
      if (effects.flags) {
        effects.flags.forEach(function (flag) {
          if (!hasFlag(flag)) {
            state.flags.push(flag);
          }
        });
      }
    }

    // Checks a choice's "requires" gate (if it has one) against the
    // current state. Returns true if the choice should be offered.
    function choiceIsAvailable(choice) {
      if (!choice.requires) {
        return true;
      }
      if (choice.requires.debt) {
        return state.debt > 0;
      }
      if (choice.requires.gold) {
        return state.goldUnits > 0;
      }
      if (choice.requires.flag) {
        return hasFlag(choice.requires.flag);
      }
      // Only offer this choice if the player picked that life in round 1.
      // Written as an early return like the others: a choice can only
      // carry one kind of gate, which keeps this function boring.
      if (choice.requires.path) {
        return state.path === choice.requires.path;
      }
      return true;
    }

    // Adds this round's earnings (the income baseline built up by
    // earlier choices) to cash. Called once at the start of handling
    // each round, before that round's own choice can change the baseline.
    function creditIncome() {
      state.cash = state.cash + state.income;
    }

    // --- Special-round rules ---
    // These rounds have mechanics described in rounds.js as plain
    // "specialRule" text because they don't fit the eight-key effects
    // model. Handled here as one-off rules keyed to the round's id, same
    // as the margin call rule is handled separately from ordinary effects.

    // Round 4: the source material resolves choices at an intraday
    // "bounce" price of 260, then revalues whatever's left at the
    // round's normal close price (198.60, from the market table).
    var ROUND_4_BOUNCE_PRICE = 260;

    // Round 7: the player's bank fails. Cash that was left "on deposit"
    // loses 60% of its value; cash withdrawn (cash_at_home) is safe.
    // Withdrawing half (deposits_exposed_half) means half the cash was
    // safe and half took the 60% loss, i.e. an overall 30% loss.
    function applyRound7BankFailure() {
      if (hasFlag("deposits_exposed_half")) {
        state.cash = state.cash * 0.7;
      } else if (hasFlag("deposits_exposed")) {
        state.cash = state.cash * 0.4;
      }
      // cash_at_home alone (fully withdrawn): no loss.
    }

    // Round 8 (1931): short time. Anyone still on the job path has their
    // income cut by 40%, because the plant no longer has enough work to
    // need them full time. A player carrying income_exposed from round 6
    // does not go on short time — their line shuts and they lose the lot,
    // fourteen months before everyone else. Business players are untouched
    // here; their bad round is round 10.
    function applyRound8ShortTime() {
      if (state.path !== "job") {
        return;
      }
      if (hasFlag("income_exposed")) {
        state.income = 0;
        state.lostLivelihood = true;
        state.flags.push("laid_off_1931");
      } else {
        state.income = Math.round(state.income * 0.6);
      }
    }

    // Round 10 (1932): the layoff. Every job-path player still earning
    // loses their wage, before they get to choose anything. This is not
    // avoidable and is not a punishment for an earlier mistake — at 25%
    // unemployment it is simply the base rate, and the game should not
    // pretend a right answer existed. income_protected from round 6 means
    // two days a week on the domestic line instead of nothing at all.
    //
    // Runs BEFORE the round's income is credited to cash, so the player
    // does not get paid for a job they no longer have.
    function applyRound10Layoff() {
      if (state.path !== "job" || state.lostLivelihood) {
        return;
      }
      state.income = hasFlag("income_protected") ? 150 : 0;
      state.lostLivelihood = true;
      state.flags.push("laid_off_1932");
    }

    // The margin call rule from config.marginCallRule: if debt is more
    // than everything the player owns, they're wiped out.
    function isMarginCalled() {
      var totalAssets = state.cash + state.stocksValue + state.goldValue;
      return state.debt > totalAssets;
    }

    // Seizes all holdings and clears debt, per the margin call rule.
    function seizeEverything() {
      state.cash = 0;
      state.debt = 0;
      state.stockUnits = 0;
      state.goldUnits = 0;
      state.stocksValue = 0;
      state.goldValue = 0;
    }

    // Replaces the round display with one of the endings from ROUNDS.endings.
    // Used when the margin call fires mid-game.
    function renderEnding(endingId) {
      var ending = ROUNDS.endings.filter(function (e) { return e.id === endingId; })[0];

      document.getElementById("date").textContent = "";
      document.getElementById("headline").textContent = ending.title;
      document.getElementById("situation").textContent = ending.text;
      document.getElementById("choices").innerHTML = "";
    }

    // Works out which of the four endings the player gets, based on
    // config.realValueRule: nominal net worth adjusted for the price
    // level, compared against what they started with.
    //
    // NOTE: the original ending descriptions in rounds.js had gaps
    // between them (e.g. nothing covered real growth between 120% and
    // 150% of starting, and "preserved" required zero debt with no
    // fallback for players near that band who still had some debt).
    // This picks non-overlapping thresholds that cover every case
    // rather than leaving anyone without an ending.
    function pickFinalEnding(realNetWorth, startingRealNetWorth) {
      if (realNetWorth <= 0) {
        return "ruined";
      }
      var ratio = realNetWorth / startingRealNetWorth;
      if (ratio >= 1.5) {
        return "thrived";
      }
      if (ratio >= 1) {
        return "preserved";
      }
      return "survived_poorer";
    }

    // Called when the player reaches the final round. Revalues one last
    // time, checks the margin call rule exactly as every other round
    // does, then works out and displays the ending.
    function showFinalResult(round) {
      // One last season of income from whatever baseline round 11 set,
      // same as every other round gets before its own effects apply.
      creditIncome();
      revalue(round.id);

      // Starting real net worth: what $2,000 in 1929 (price level 100)
      // is worth as a baseline for comparison. Used either way below.
      var startingNominal = ROUNDS.config.startingCash - ROUNDS.config.startingDebt;
      var startingReal = startingNominal / (ROUNDS.market["r1"].priceLevel / 100);

      var endingId;
      var realNetWorth;

      if (isMarginCalled()) {
        seizeEverything();
        endingId = "ruined";
        realNetWorth = 0; // everything was just seized
      } else {
        // Real net worth = nominal net worth adjusted for the price level,
        // per config.realValueRule.
        var nominalNetWorth = state.cash + state.stocksValue + state.goldValue - state.debt;
        realNetWorth = nominalNetWorth / (ROUNDS.market[round.id].priceLevel / 100);
        endingId = pickFinalEnding(realNetWorth, startingReal);
      }
      updateStatusBar();

      var ending = ROUNDS.endings.filter(function (e) { return e.id === endingId; })[0];
      var choicesDiv = document.getElementById("choices");

      var title = document.createElement("h2");
      title.textContent = ending.title;
      var text = document.createElement("p");
      text.textContent = ending.text;
      choicesDiv.appendChild(title);
      choicesDiv.appendChild(text);

      // Per config.realValueRule: show the price-adjusted numbers behind
      // the ending. This comparison is described as "the whole lesson".
      var summary = document.createElement("p");
      summary.textContent = "Real net worth, adjusted for how much prices changed: $" +
        Math.round(realNetWorth) + ". You started with $" + Math.round(startingReal) + ".";
      choicesDiv.appendChild(summary);
    }

    // Fills the page with the round at the given index.
    function renderRound(index) {
      var round = ROUNDS.rounds[index];

      document.getElementById("date").textContent = round.date;
      document.getElementById("headline").textContent = round.headline;

      // The situation text is shared by everyone, then optionally has a
      // path-specific paragraph added. This is how one round can tell a
      // job player they have been laid off and a business player their
      // takings have collapsed, without writing the whole round twice.
      var situationText = round.situation;
      if (round.situationAppend && state.path && round.situationAppend[state.path]) {
        situationText = situationText + "\n\n" + round.situationAppend[state.path];
      }
      document.getElementById("situation").textContent = situationText;

      // Clear out the old choice buttons before adding new ones.
      var choicesDiv = document.getElementById("choices");
      choicesDiv.innerHTML = "";

      // The last round has no choices — it's where the game ends and
      // the final scoring happens, instead of showing more buttons.
      // showFinalResult does one last revalue of its own, so the chart
      // update below must come AFTER it here, not before — otherwise the
      // round-12 bars would show round 11's numbers while the status bar
      // already shows the true final ones.
      if (round.isEnding) {
        showFinalResult(round);
        if (chartsAvailable) {
          updateCharts(round);
          updateHistoricalCharts(round);
        }
        return;
      }

      // Add this round's price point to all four charts. For every other
      // round, state is already fully settled by this point (the previous
      // round's click handler ran revalue() before we got here), so it's
      // fine to do this before building the choice buttons below. Skipped
      // entirely if the charts failed to load — see chartsAvailable.
      if (chartsAvailable) {
        updateCharts(round);
        updateHistoricalCharts(round);
      }

      // Only offer choices whose "requires" gate (if any) is currently met.
      var availableChoices = round.choices.filter(choiceIsAvailable);

      availableChoices.forEach(function (choice) {
        var button = document.createElement("button");
        button.textContent = choice.label;
        // Clicking any choice just moves on to the next round in the list.
        // There's no branching in WHICH round comes next — only in which
        // choices and text are shown, based on path.
        button.onclick = function () {
          // Rounds 8 and 10: unemployment lands before anything else in
          // the round, including before wages are credited. A player laid
          // off in 1932 is not paid for 1932.
          if (round.id === "r8") {
            applyRound8ShortTime();
          }
          if (round.id === "r10") {
            applyRound10Layoff();
          }

          creditIncome();

          // Round 4: this round's buy/sell choices transact at the
          // invented mid-round bounce price, not the round's listed price.
          var overridePrice = round.id === "r4" ? ROUND_4_BOUNCE_PRICE : undefined;
          applyEffects(choice.effects, round.id, overridePrice);

          // Round 7: apply the bank-failure cash haircut now that this
          // round's choice has set its flags (cash_at_home etc.).
          if (round.id === "r7") {
            applyRound7BankFailure();
          }

          // Revaluation always uses the round's real listed price — for
          // round 4 that's 198.60, not the 260 bounce price used above.
          revalue(round.id);

          // Check the margin call rule before moving on. If it fires,
          // the game ends here — everything is seized and we stop.
          if (isMarginCalled()) {
            seizeEverything();
            updateStatusBar();
            renderEnding("ruined");
            return;
          }

          updateStatusBar();
          currentRoundIndex = currentRoundIndex + 1;
          renderRound(currentRoundIndex);
        };
        choicesDiv.appendChild(button);
      });
    }

    // Fill in the status bar with the starting values.
    updateStatusBar();

    // Whether the charts loaded successfully. Chart.js comes from an
    // external CDN — if a player's ad blocker or network blocks it,
    // set up would throw and, without this, take the whole page down
    // with it. The charts are a nice-to-have; the game text and
    // choices below must still work even if they can't load.
    var chartsAvailable = true;
    try {
      initCharts();
      initHistoricalCharts();
    } catch (e) {
      chartsAvailable = false;
      document.getElementById("charts").style.display = "none";
      document.getElementById("historical-charts").style.display = "none";
    }

    // Show the first round as soon as the page loads.
    renderRound(currentRoundIndex);
  </script>

</body>
</html>
